name: Build and Test AddressBook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Compile AddressBook
        run: |
          gcc -Wall -Wextra -std=c11 \
            main.c contact.c utils.c file.c \
            -o addressbook

      - name: Compile unit tests
        run: |
          gcc -Wall -Wextra -std=c11 -I\
            tests/test_utils.c utils.c \
            -o test_utils

      - name: Run unit tests
        run: ./test_utils
